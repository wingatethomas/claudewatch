name: Security Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --no-hashes --no-emit-project | grep -vi 'pyobjc' > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps
      - name: Static security analysis (bandit)
        run: uvx bandit -r claudewatch/ --severity-level medium --confidence-level medium
