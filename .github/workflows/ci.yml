name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'icons/**'
      - '.superpowers/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'icons/**'
      - '.superpowers/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Check layer rules
        run: |
          uv sync --no-install-workspace --only-group dev
          uv run python scripts/audit_imports.py --check

  test:
    runs-on: macos-14  # ARM64 — PyObjC requires macOS
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run tests with coverage
        run: uv run pytest -v --cov=claudewatch --cov-report=term-missing --cov-fail-under=75

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --no-hashes | grep -vi 'pyobjc' > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps
