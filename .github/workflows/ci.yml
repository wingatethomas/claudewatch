name: CI

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (optional — checks out PR head)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.event.inputs.pr || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Check layer rules
        run: python3 scripts/audit_imports.py --check

  test:
    runs-on: macos-14
    needs: lint
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Run tests with coverage
        run: uv run pytest -v --cov=claudewatch --cov-report=term-missing --cov-fail-under=70

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --no-hashes --no-emit-project | grep -vi 'pyobjc' > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --ignore-vuln CVE-2026-4539
