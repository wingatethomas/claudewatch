name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (optional — checks out PR head)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.inputs.pr || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    # Runs on every PR event (and workflow_dispatch). ruff + audit_imports are
    # cheap, so contributors get fast feedback without needing the
    # `ready to merge` label.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Check layer rules
        run: python3 scripts/audit_imports.py --check

  test:
    # macOS-14 minutes are expensive — gate on the `ready to merge` label so
    # the full test suite only runs on PRs that are actually about to land.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ready to merge')
    runs-on: macos-14
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Run tests with coverage
        run: uv run pytest -v --cov=claudewatch --cov-report=term-missing --cov-fail-under=70

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ready to merge')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Audit dependencies for known vulnerabilities
        continue-on-error: true
        run: |
          uv export --no-hashes --no-emit-project | grep -vi 'pyobjc' > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps
