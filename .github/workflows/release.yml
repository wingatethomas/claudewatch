name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # ARM64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Build .app bundle
        run: |
          uv run briefcase create macOS --no-input || true
          uv run briefcase build macOS --no-input
          uv run briefcase package macOS --adhoc-sign --no-input

      - name: Zip the app
        run: |
          cd build/claudewatch/macos/app
          zip -r ../../../../ClaudeWatch-${{ github.ref_name }}-arm64.zip ClaudeWatch.app

      - name: Create GitHub Release
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -q '-'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            ClaudeWatch-${{ github.ref_name }}-arm64.zip \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
