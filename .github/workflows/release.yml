name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: macos-14  # ARM64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Build .app bundle
        run: |
          uv run briefcase create macOS --no-input || true
          uv run briefcase build macOS --no-input
          uv run briefcase package macOS --adhoc-sign --no-input

      - name: Zip the app and generate checksums
        run: |
          cd build/claudewatch/macos/app
          zip -r "../../../../ClaudeWatch-${TAG}-arm64.zip" ClaudeWatch.app
          cd ../../../..
          shasum -a 256 "ClaudeWatch-${TAG}-arm64.zip" > checksums.txt
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        run: |
          PRERELEASE=""
          if echo "$TAG" | grep -q '-'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            "ClaudeWatch-${TAG}-arm64.zip" \
            checksums.txt \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Upload checksums artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: checksums.txt

  update-tap:
    needs: build
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checksums

      - name: Update Homebrew tap
        run: |
          VERSION="${TAG#v}"
          SHA256=$(awk '{print $1}' checksums.txt)
          git clone https://github.com/wingatethomas/homebrew-claudewatch.git tap
          cd tap
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/wingatethomas/homebrew-claudewatch.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bump-${VERSION}"
          git checkout -b "$BRANCH"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/claudewatch.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/claudewatch.rb
          git add Casks/claudewatch.rb
          git commit -m "bump claudewatch to ${VERSION}"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --repo wingatethomas/homebrew-claudewatch \
            --title "bump claudewatch to ${VERSION}" \
            --body "Automated update from [release ${TAG}](https://github.com/wingatethomas/claudewatch/releases/tag/${TAG}). SHA256: \`${SHA256}\`")
          gh pr merge "$PR_URL" --auto --squash
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
