name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Build .app bundle
        run: |
          uv run briefcase create macOS || true
          uv run briefcase build macOS
          uv run briefcase package macOS --no-sign

      - name: Zip the app
        run: |
          cd macOS/ClaudeWatch
          zip -r ../../ClaudeWatch-${{ github.ref_name }}-arm64.zip ClaudeWatch.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClaudeWatch-${{ github.ref_name }}-arm64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
