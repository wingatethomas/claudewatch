<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1e1e1e;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  font-size: 12px;
  overflow-x: hidden;
  -webkit-user-select: none;
}
.section { margin-bottom: 20px; }
.section-header {
  font-size: 10px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  padding-left: 2px;
}

/* Force graph */
#force-graph {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
}
#force-graph svg { display: block; }
.node { cursor: pointer; }
.node circle { stroke: rgba(255,255,255,0.2); stroke-width: 1px; }
.node text { font-size: 9px; fill: #ccc; pointer-events: none; }
.link { stroke: rgba(255,255,255,0.12); stroke-width: 1px; }
.node.dimmed circle { opacity: 0.15; }
.node.dimmed text { opacity: 0.15; }
.link.dimmed { opacity: 0.05; }
.tooltip {
  position: absolute;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  color: #e0e0e0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 100;
  max-width: 250px;
}

/* Bar charts */
.chart-container {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 12px;
}
.bar-row {
  display: flex;
  align-items: center;
  height: 22px;
  margin-bottom: 2px;
}
.bar-label {
  width: 140px;
  font-size: 11px;
  color: #ccc;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
  margin: 0 8px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}
.bar-value {
  width: 50px;
  text-align: right;
  font-size: 11px;
  color: #888;
  flex-shrink: 0;
}
.bar-fill.pattern { background: #5b8def; }
.bar-fill.hotspot { background: #e8914f; }

.empty-state {
  text-align: center;
  color: #666;
  padding: 40px 0;
  font-size: 13px;
}
</style>
</head>
<body>
<div id="app" style="padding: 16px 24px; max-width: 900px; margin: 0 auto;"></div>
<div class="tooltip" id="tooltip"></div>

<script src="d3.v7.min.js"></script>
<script>
const DATA = __DATA__;

const app = d3.select("#app");
const tooltip = d3.select("#tooltip");
const W = Math.min(document.body.clientWidth - 48, 852);

if (DATA.graph.nodes.length === 0) {
  app.append("div").attr("class", "empty-state").text("Graph data will appear after the first background scan.");
} else {
  renderForceGraph();
  renderPatterns();
  renderHotspots();
}

function renderForceGraph() {
  const section = app.append("div").attr("class", "section");
  section.append("div").attr("class", "section-header").text("SESSION GRAPH");

  const container = section.append("div").attr("id", "force-graph");
  const height = 450;
  const svg = container.append("svg").attr("width", W).attr("height", height);
  const g = svg.append("g");

  // Zoom
  svg.call(d3.zoom().scaleExtent([0.3, 4]).on("zoom", e => g.attr("transform", e.transform)));

  const nodes = DATA.graph.nodes;
  const edges = DATA.graph.edges;

  // Deduplicate edges
  const edgeSet = new Set();
  const uniqueEdges = edges.filter(e => {
    const key = e.source + "|" + e.target;
    if (edgeSet.has(key)) return false;
    edgeSet.add(key);
    return true;
  });

  const colorMap = { session: "#5b8def", action: "#e8914f", file: "#6cc070" };
  const sizeMap = { session: 6, action: 4, file: 5 };

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(uniqueEdges).id(d => d.id).distance(40).strength(0.3))
    .force("charge", d3.forceManyBody().strength(-60))
    .force("center", d3.forceCenter(W / 2, height / 2))
    .force("collision", d3.forceCollide().radius(12));

  const link = g.selectAll(".link")
    .data(uniqueEdges).join("line").attr("class", "link");

  const node = g.selectAll(".node")
    .data(nodes).join("g").attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append("circle")
    .attr("r", d => sizeMap[d.type] || 4)
    .attr("fill", d => colorMap[d.type] || "#888");

  node.append("text")
    .attr("dx", 8).attr("dy", 3)
    .text(d => d.label);

  // Hover
  node.on("mouseover", (e, d) => {
    tooltip.style("opacity", 1)
      .html(`<strong>${d.type}</strong><br>${d.label}`)
      .style("left", (e.pageX + 12) + "px")
      .style("top", (e.pageY - 10) + "px");
  })
  .on("mouseout", () => tooltip.style("opacity", 0));

  // Click to highlight connections
  let selected = null;
  node.on("click", (e, d) => {
    if (selected === d.id) {
      selected = null;
      node.classed("dimmed", false);
      link.classed("dimmed", false);
      return;
    }
    selected = d.id;
    const connected = new Set([d.id]);
    uniqueEdges.forEach(e => {
      const sid = typeof e.source === "object" ? e.source.id : e.source;
      const tid = typeof e.target === "object" ? e.target.id : e.target;
      if (sid === d.id) connected.add(tid);
      if (tid === d.id) connected.add(sid);
    });
    node.classed("dimmed", n => !connected.has(n.id));
    link.classed("dimmed", l => {
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      return !connected.has(sid) || !connected.has(tid);
    });
  });

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // Legend
  const legend = section.append("div").style("padding", "6px 8px").style("font-size", "10px").style("color", "#888");
  [["session", "#5b8def"], ["action", "#e8914f"], ["file", "#6cc070"]].forEach(([t, c]) => {
    legend.append("span").style("display", "inline-block").style("width", "8px").style("height", "8px")
      .style("background", c).style("border-radius", "50%").style("margin-right", "4px");
    legend.append("span").text(t).style("margin-right", "12px");
  });
}

function renderPatterns() {
  if (!DATA.patterns.length) return;
  const section = app.append("div").attr("class", "section");
  section.append("div").attr("class", "section-header").text("WORKFLOW PATTERNS");
  const container = section.append("div").attr("class", "chart-container");
  const max = d3.max(DATA.patterns, d => d.frequency);
  DATA.patterns.forEach(p => {
    const row = container.append("div").attr("class", "bar-row");
    row.append("div").attr("class", "bar-label").text(p.first + " → " + p.then);
    const track = row.append("div").attr("class", "bar-track");
    track.append("div").attr("class", "bar-fill pattern")
      .style("width", ((p.frequency / max) * 100) + "%");
    row.append("div").attr("class", "bar-value").text(p.frequency);
  });
}

function renderHotspots() {
  if (!DATA.hotspots.length) return;
  const section = app.append("div").attr("class", "section");
  section.append("div").attr("class", "section-header").text("FILE HOTSPOTS");
  const container = section.append("div").attr("class", "chart-container");
  const max = d3.max(DATA.hotspots, d => d.session_count);
  DATA.hotspots.forEach(h => {
    const parts = h.path.split("/");
    const short = parts.length > 2 ? ".../" + parts.slice(-2).join("/") : h.path;
    const row = container.append("div").attr("class", "bar-row")
      .attr("title", h.path);
    row.append("div").attr("class", "bar-label").text(short);
    const track = row.append("div").attr("class", "bar-track");
    track.append("div").attr("class", "bar-fill hotspot")
      .style("width", ((h.session_count / max) * 100) + "%");
    row.append("div").attr("class", "bar-value").text(h.session_count + " sess");
  });
}
</script>
</body>
</html>
