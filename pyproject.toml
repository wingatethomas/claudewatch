[project]
name = "claudewatch"
version = "0.1.0"
description = "macOS menu bar app for monitoring Claude Code sessions"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
authors = [{name = "ClaudeWatch Contributors"}]
dependencies = [
    "rumps==0.4.0",
    "pyobjc-framework-Cocoa~=12.1",
    "pyobjc-framework-Quartz~=12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0",
]

[project.scripts]
claudewatch = "claudewatch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudewatch"]
