[project]
name = "claudewatch"
version = "0.7.0"
description = "macOS menu bar app for monitoring Claude Code sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{name = "ClaudeWatch Contributors"}]
dependencies = [
    "pyobjc-framework-Cocoa~=12.1",
    "pyobjc-framework-Quartz~=12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0",
    "briefcase>=0.3",
    "pytest-cov>=7.0.0",
    "pip-audit>=2.10.0",
]

[project.scripts]
claudewatch = "claudewatch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudewatch"]

# Briefcase app packaging
[tool.briefcase]
project_name = "ClaudeWatch"
bundle = "com.claudewatch"
version = "0.7.0"
url = "https://github.com/wingatethomas/claudewatch"
license.file = "LICENSE"
author = "ClaudeWatch Contributors"

[tool.briefcase.app.claudewatch]
formal_name = "ClaudeWatch"
description = "macOS menu bar app for monitoring Claude Code sessions"
icon = "icons/claudewatch"
sources = ["claudewatch"]
requires = [
    "pyobjc-framework-Cocoa~=12.1",
    "pyobjc-framework-Quartz~=12.1",
]

[tool.briefcase.app.claudewatch.macOS]
requires = []
system_requires = []

[tool.briefcase.app.claudewatch.macOS.info]
LSUIElement = true
NSAppleEventsUsageDescription = "ClaudeWatch needs automation access to read terminal windows and focus sessions."
NSDesktopFolderUsageDescription = "ClaudeWatch does not need access to your Desktop."
NSDocumentsFolderUsageDescription = "ClaudeWatch does not need access to your Documents."
NSDownloadsFolderUsageDescription = "ClaudeWatch does not need access to your Downloads."

[tool.coverage.run]
source = ["claudewatch"]
omit = [
    "claudewatch/__main__.py",
    "claudewatch/ui/*",
    "claudewatch/backend/*/dependencies.py",
    "claudewatch/backend/core/*/dependencies.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
