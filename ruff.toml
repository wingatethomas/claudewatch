line-length = 120
indent-width = 4
target-version = "py313"

[lint]
select = [
    "F",      # Pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
]

ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",  # trailing comma (conflicts with formatter)
    "E501",    # line too long (handled by formatter)
    "S603",    # subprocess call with untrusted input (PIDs are validated ints)
    "S607",    # partial executable path (we use pgrep, ps, etc.)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "ANN", "PLR2004", "ARG", "PLC0415", "PT019"]
"claudewatch/ui/preferences/delegate.py" = ["N802", "ARG", "ANN", "PLR2004", "PLC0415"]  # ObjC selectors, lazy handler imports (circular dep avoidance)
"claudewatch/ui/preferences/panes/*.py" = ["N802", "ARG", "ANN", "PLR2004"]  # ObjC selectors
"claudewatch/ui/preferences/handlers/*.py" = ["N802", "ARG", "ANN", "PLR2004", "PLC0415"]  # ObjC selectors, lazy imports (circular dep)
"claudewatch/ui/preferences/window.py" = ["N802", "ARG", "ANN", "PLR2004"]  # ObjC selectors
"claudewatch/ui/activity.py" = ["N802", "ARG002"]  # ObjC delegate methods

[format]
quote-style = "double"
indent-style = "space"
